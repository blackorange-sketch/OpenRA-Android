name: RA2 check

on:
  push:
    branches: [ra2]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-lint-${{ hashFiles('OPENRA_REF', 'RA2_REF') }}
      - name: Build the mod and check its YAML
        run: bash scripts/check-ra2.sh 2>&1 | tee ra2-check.log
